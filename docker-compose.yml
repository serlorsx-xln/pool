services:
  bifrost:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - bifrost-data:/app/data/db
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=3000
      - LOG_LEVEL=info
      - LOG_STYLE=json
      - BIFROST_ENCRYPTION_KEY=${BIFROST_ENCRYPTION_KEY}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  bifrost-data:
