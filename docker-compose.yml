services:
  bifrost:
    image: maximhq/bifrost:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - bifrost-data:/app/data
      - ./data/config.json:/app/data/config.json
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - LOG_LEVEL=info
      - LOG_STYLE=json
      - BIFROST_ENCRYPTION_KEY=${BIFROST_ENCRYPTION_KEY}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  bifrost-data:
