services:
  bifrost:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - bifrost-data-v2:/app/data/db
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=3000
      - LOG_LEVEL=info
      - LOG_STYLE=json
      - BIFROST_ENCRYPTION_KEY=${BIFROST_ENCRYPTION_KEY}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY}
      - NICEDAY_API_KEY=${NICEDAY_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bifrost
      - POSTGRES_PASSWORD=0690a8f3368cc0cd29060de48979f05d
      - POSTGRES_DB=bifrost_logs
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bifrost -d bifrost_logs"]
      interval: 10s
      timeout: 5s
      retries: 3

  db-migrate:
    build:
      context: ./migrate
      dockerfile: Dockerfile
    restart: "no"
    volumes:
      - bifrost-data-v2:/sqlite:ro
    environment:
      - SQLITE_PATH=/sqlite/logs.db
      - PG_DSN=host=postgres port=5432 user=bifrost password=0690a8f3368cc0cd29060de48979f05d dbname=bifrost_logs
      - VK=sk-bf-4694ab2c-a7d8-4c7f-871f-01090a0645f3
      - GATEWAY=http://bifrost:3000
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  bifrost-data-v2:
  redis-data:
  postgres-data:
