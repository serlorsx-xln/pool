services:
  bifrost:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - bifrost-data-v2:/app/data/db
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=3000
      - LOG_LEVEL=info
      - LOG_STYLE=json
      - BIFROST_ENCRYPTION_KEY=${BIFROST_ENCRYPTION_KEY}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY}
      - NICEDAY_API_KEY=${NICEDAY_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  bifrost-data-v2:
  redis-data:
